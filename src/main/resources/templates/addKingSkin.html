<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>添加王者皮肤</title>
  <style>
    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"微软雅黑";
    }
    html,body {
      height:100%;
    }
    body {
      background:url("/image/zhu.png") center/cover no-repeat fixed;
      position:relative;
    }
    body::before {
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.3);
    }

    .add-box {
      width:420px;
      position:absolute;
      right:60px;
      top:50%;
      transform:translateY(-50%);
      padding:50px 40px;
      background: linear-gradient(160deg, #1a1a1e 0%, #2b1818 50%, #4c1c1c 100%);
      border-radius:24px;
      z-index:10;
      color:#fff;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      max-height: 90vh;
      overflow-y: auto;
    }
    h2 {
      text-align:center;
      margin-bottom:30px;
      font-size:26px;
      color: #f8e0b8;
      text-shadow: 0 0 8px #ffcc66;
    }
    .item {
      margin-bottom:22px;
    }
    .item label {
      display:block;
      margin-bottom:8px;
      font-size:14px;
      color:#eee;
    }
    .item input, .item select {
      width:100%;
      height:46px;
      padding:0 16px;
      background: rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.3);
      border-radius:12px;
      color:#fff;
      outline:none;
      font-size:15px;
    }
    .item select option {
      background:#222;
      color:#fff;
    }
    .tip {
      font-size:12px;
      opacity:0.7;
      margin-top:4px;
    }

    /* ✅ 图片预览框（明亮清晰）*/
    .img-preview {
      width:120px;
      height:120px;
      border:1px solid rgba(255,255,255,0.3);
      border-radius:12px;
      margin-top:10px;
      overflow:hidden;
      background:rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-preview img {
      width:100%;
      height:100%;
      object-fit:cover;
      background:#fff;
    }

    .btn {
      width:100%;
      height:48px;
      background:linear-gradient(to right, #ff4c4c, #ff1a1a);
      color:#fff;
      border:none;
      border-radius:14px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
      transition:0.3s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255,60,60,0.4);
    }
    .back {
      background:#444;
      margin-top:12px;
    }
  </style>
</head>

<body>

<div class="add-box">
  <h2>添加英雄皮肤</h2>

  <form action="/king/addKingSkin" method="post">
    <div class="item">
      <label>英雄名称</label>
      <input type="text" name="heroName" placeholder="例如：李白" required>
    </div>

    <div class="item">
      <label>英雄定位</label>
      <select name="heroPosition" required>
        <option value="">请选择定位</option>
        <option value="法师">法师</option>
        <option value="射手">射手</option>
        <option value="刺客">刺客</option>
        <option value="战士">战士</option>
        <option value="坦克">坦克</option>
        <option value="辅助">辅助</option>
      </select>
    </div>

    <div class="item">
      <label>皮肤名称</label>
      <input type="text" name="skinName" placeholder="例如：凤求凰" required>
    </div>

    <!-- ✅ 带图片预览 -->
    <div class="item">
      <label>皮肤图片路径</label>
      <input type="text" name="skinImg" id="imgPath" oninput="p()" placeholder="/image/xxx.jpg" required>
      <div class="tip">图片放在 static/image 下</div>
      <div class="img-preview"><img id="preImg"></div>
    </div>

    <div class="item">
      <label>皮肤品质</label>
      <select name="skinQuality" required>
        <option value="">请选择品质</option>
        <option value="伴生">伴生</option>
        <option value="勇者">勇者</option>
        <option value="史诗">史诗</option>
        <option value="传说">传说</option>
        <option value="珍品传说">珍品传说</option>
        <option value="限定">限定</option>
        <option value="无双">无双</option>
        <option value="珍品无双">珍品无双</option>
        <option value="荣耀典藏">荣耀典藏</option>
      </select>
    </div>

    <div class="item">
      <label>皮肤价格</label>
      <input type="number" step="2" name="skinPrice" placeholder="请输入价格" required>
    </div>

    <div class="item">
      <label>库存数量</label>
      <input type="number" name="skinStock" placeholder="请输入库存" required>
    </div>

    <button class="btn">提交添加皮肤</button>
  </form>

  <button class="btn back" onclick="location.href='/king/all'">返回王者商城</button>
</div>

<!-- ✅ 图片预览 JS -->
<script>
  function p(){
    document.getElementById("preImg").src = document.getElementById("imgPath").value;
  }
</script>

</body>
</html>
