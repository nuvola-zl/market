<!DOCTYPE html>

            font-family: "微软雅黑", "幼圆", sans-serif;
        }

        html, body {
            height: 100%;
        }
        body {
            background: url("/image/5.jpg") center/cover no-repeat fixed;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
        }

        /* 右侧中部卡片 */
        .box {
            width: 460px;
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            padding: 50px 45px;
            background: linear-gradient(160deg, #1a1a2e 0%, #251d3a 50%, #3a1c45 100%);
            border-radius: 24px;
            z-index: 10;
            text-align: center;
            color: #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            max-height: 90vh;
            overflow-y: auto;
        }
        h2 {
            font-size: 26px;
            margin-bottom: 30px;
            color: #ffd0e6;
        }
        .info {
            font-size: 16px;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .btn {
            display: block;
            width: 260px;
            height: 46px;
            line-height: 46px;
            background: linear-gradient(to right, #409eff, #6b9fff);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            margin: 14px auto;
            font-size: 15px;
            transition: 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .red {
            background: linear-gradient(to right, #f56c6c, #ff8585);
        }
    </style>
</head>

<div class="box">
    <h2>长沙继伟超市</h2>
    <div class="info" th:if="${session.loginUser != null}">
        欢迎：[[${session.loginUser.username}]]<br>
        身份：[[${session.loginUser.role=='admin'?'管理员':'用户'}]]
    </div>
    <div class="info" th:if="${session.loginUser == null}">请先登录系统</div>

    <a class="btn" th:if="${session.loginUser?.role=='admin'}" href="/admin/goods">商品管理</a>
    <a class="btn" href="/cashier">收银台</a>
    <a class="btn" href="/home/add">添加商品</a>
    <a class="btn" href="/home/goods">查询商品</a>

    <!-- 🔥 新增：王者荣耀皮肤商城按钮 -->
    <a class="btn" href="/king/all" style="background: linear-gradient(to right, #ff4c4c, #ff1a1a);">王者荣耀皮肤商城</a>

    <a class="btn red" th:if="${session.loginUser != null}" href="/home/logout">退出登录</a>
    <a class="btn" th:if="${session.loginUser == null}" href="/login">立即登录</a>
</div>
