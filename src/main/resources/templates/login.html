<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>

    <title>长沙继伟超市购买系统 - 登录</title>

    <!-- 👇 2. 改标签页图标！引入你自己的favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/image/1.ico}">

    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", "幼圆", "方正卡通简体", sans-serif;
        }

        /* 白天主题 */
        :root {
            --bg-body: #f9fafb;
            --card-bg: rgba(255, 255, 255, 0.82);
            --card-border: rgba(255, 255, 255, 0.3);
            --text-main: #333;
            --text-sub: #666;
            --input-bg: rgba(255,255,255,0.7);
            --input-border: #dcdfe6;
            --btn-color: #409eff;
            --btn-hover: #337ecc;
            --star-color: #409eff;
        }

        /* 黑夜主题 */
        [data-theme="dark"] {
            --bg-body: #0b0f1a;
            --card-bg: rgba(30, 30, 50, 0.8);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #eee;
            --text-sub: #ccc;
            --input-bg: rgba(40,40,60,0.6);
            --input-border: #444;
            --btn-color: #6b9fff;
            --btn-hover: #5288ee;
            --star-color: #ffffff;
        }

        body {
            background-color: var(--bg-body);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: all 0.6s ease;
        }

        /* 背景 + 流星 */
        .left-bg {
            width: 65%;
            position: relative;
            overflow: hidden;
            background: url("/image/1.jpeg") center / cover no-repeat;
        }
        .left-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.25);
        }

        .dot {
            position: absolute;
            background: var(--star-color);
            border-radius: 50%;
            opacity: 0.7;
        }

        .meteor {
            position: absolute;
            width: 1px;
            height: 80px;
            background: linear-gradient(to bottom, transparent, var(--star-color));
            opacity: 0.6;
            transform: rotate(-45deg);
            animation: meteorRun linear infinite;
        }
        @keyframes meteorRun {
            0% {transform: translateX(0) translateY(-100px) rotate(-45deg);opacity:0;}
            10% {opacity:1;}
            90% {opacity:1;}
            100% {transform: translateX(600px) translateY(1000px) rotate(-45deg);opacity:0;}
        }

        /* 右侧布局 */
        .right-box {
            width: 35%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 9;
        }

        /* ----------------------- */
        /* 🔥 古风毛玻璃登录框 */
        /* ----------------------- */
        .login-card {
            width: 380px;
            padding: 50px 40px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 22px;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.6s ease;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 8px;
        }
        .sub-title {
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 40px;
            font-size: 14px;
        }

        .msg {
            color: #f56c6c;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .input-item {
            margin-bottom: 24px;
        }
        .input-item input {
            width: 100%;
            height: 48px;
            padding: 0 18px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            color: var(--text-main);
            transition: 0.3s;
        }
        .input-item input:focus {
            border-color: var(--btn-color);
            box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.1);
        }

        .login-btn {
            width: 100%;
            height: 48px;
            background: var(--btn-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            background: var(--btn-hover);
        }

        .link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }
        .link a {
            color: var(--btn-color);
            text-decoration: none;
        }

        /* 日夜切换开关 */
        .theme-switch {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 26px;
            border-radius: 999px;
            background: #ccc;
            cursor: pointer;
            transition: 0.5s;
            z-index:10;
        }
        .theme-switch::after {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.5s;
        }
        [data-theme="dark"] .theme-switch {
            background: #6b9fff;
        }
        [data-theme="dark"] .theme-switch::after {
            left: 26px;
        }
    </style>
</head>
<body>

<div class="left-bg" id="starArea"></div>

<div class="right-box">
    <div class="theme-switch" id="themeBtn"></div>
    <div class="login-card">
        <div class="title">网上超市购买系统</div>
        <div class="sub-title">欢迎登录</div>

        <div class="msg" th:text="${msg}" th:if="${msg != null}"></div>

        <form action="/login" method="post">
            <div class="input-item">
                <input type="text" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="input-item">
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button class="login-btn" type="submit">立即登录</button>
        </form>

        <div class="link">
            <a href="/register">没有账号？去注册</a>
        </div>
    </div>
</div>

<script>
    const starArea = document.getElementById('starArea');

    // 蓝色颗粒
    for(let i=0;i<=800;i++){
        let dot = document.createElement('div');
        dot.className = 'dot';
        let size = Math.random() * 2 + 0.5;
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.left = Math.random()*100 + '%';
        dot.style.top = Math.random()*100 + '%';
        starArea.appendChild(dot);
    }

    // 流星
    function createMeteor(){
        let m = document.createElement('div');
        m.className = 'meteor';
        m.style.left = Math.random() * 100 + '%';
        m.style.animationDuration = Math.random() * 2 + 1 + 's';
        starArea.appendChild(m);
        setTimeout(()=>{m.remove()},4000);
    }
    setInterval(createMeteor, 80);

    // 日夜切换
    const themeBtn = document.getElementById('themeBtn');
    const html = document.documentElement;
    if(localStorage.getItem('theme') === 'dark'){
        html.setAttribute('data-theme','dark');
    }
    themeBtn.onclick = function(){
        if(html.hasAttribute('data-theme')){
            html.removeAttribute('data-theme');
            localStorage.setItem('theme','light');
        }else{
            html.setAttribute('data-theme','dark');
            localStorage.setItem('theme','dark');
        }
    };
</script>
</body>
</html>
